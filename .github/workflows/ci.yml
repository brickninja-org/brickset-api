name: CI

on:
  push:
    branches:
      - "main"
      - "changeset-release/**"
  pull_request:
    branches: [ "main" ]
  merge_group:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 22, 24 ]

    steps:
    - uses: actions/checkout@v6
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11.4.0
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
    - run: pnpm install --frozen-lockfile
    - run: pnpm test:coverage-script
    - run: pnpm verify:coverage
    - run: pnpm verify:workspace-versions
    - run: pnpm verify:pack
    - run: pnpm test
    - run: pnpm build

  success:
    name: Success
    needs: [build]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - run: jq --exit-status 'all(.result == "success")' <<< '${{ toJson(needs) }}'
    - run: exit 0

  publish-npm:
    name: Publish / npm
    runs-on: ubuntu-latest
    needs: [success]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup git user
        run: |
          git config --global user.email "982883+brickninja-release-bot[bot]@users.noreply.github.com"
          git config --global user.name "brickninja-release-bot[bot]"

      - name: Create Release Pull Request
        uses: changesets/action@v1.8.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        with:
          title: New Release
          commit: Create new release
          publish: pnpm release
          setupGitUser: false
